/* Returns the image for a style, and whether it is an exact orientation match. */
function pdImage(seriesNo, orientation) {
    const n = String(seriesNo).replace('G', '');
    const exact = PD_IMAGE[`${n}|${orientation}`];
    if (exact)
        return { src: exact, orientation, exact: true };
    const fallback = PD_IMAGE[`${n}|Vertical`];
    return fallback ? { src: fallback, orientation: 'Vertical', exact: false } : null;
}
/* Suction side is 381 (inlet) or 382 (strainer inlet); discharge is 380
   (outlet) or 383 (CBV outlet). A G suffix denotes grooved end connections;
   without it the drop is flanged. */
const PD_SUCTION_SERIES = ['381', '382'];
const PD_DISCHARGE_SERIES = ['380', '383'];
const PD_SERIES_NAME = {
    '380': 'Discharge Outlet',
    '381': 'Suction Inlet',
    '382': 'Strainer Inlet',
    '383': 'Discharge CBV Outlet',
};
/* Series 381 / 381G are published in a single vertical configuration only. */
const pdVerticalOnly = (series) => String(series).replace('G', '') === '381';
/* Schedule 40 inside diameters, for the advisory velocity check only. */
const PIPE_ID = { 3: 3.068, 4: 4.026, 5: 5.047, 6: 6.065, 8: 7.981, 10: 10.02, 12: 11.938 };
const PD_MAX_VELOCITY = 8; // ft/s, matching the sizing basis note on the quotation
const pdSeriesKey = (series, ogs) => `${series}${ogs ? 'G' : ''}`;
const pdSizeSort = (a, b) => {
    const parse = (z) => z.split(' x ').map((n) => parseFloat(n.replace('-1/2', '.5')));
    const [ap, ac] = parse(a);
    const [bp, bc] = parse(b);
    return ap - bp || ac - bc;
};
function pdSizes(seriesKey) {
    const t = PD_CATALOG[seriesKey];
    return t ? Object.keys(t).sort(pdSizeSort) : [];
}
/* Connection sizes offered across both selected series, for the pump
   connection filter. */
function pdConnectionSizes(seriesKeys) {
    const out = new Set();
    for (const k of seriesKeys) {
        for (const size of pdSizes(k))
            out.add(size.split(' x ')[1]);
    }
    return [...out].sort((a, b) => parseFloat(a.replace('-1/2', '.5')) - parseFloat(b.replace('-1/2', '.5')));
}
function pdPartNumber(seriesKey, size, orientation, therm) {
    const token = PD_SIZE_TOKEN[size];
    if (!token)
        return null;
    const ogs = seriesKey.endsWith('G');
    const base = ogs ? 'PG' : 'PE'; // grooved : flanged
    const horizontal = orientation === 'Horizontal';
    const tail = horizontal ? (therm === 'UNEF' ? '2' : 'L') : (therm === 'UNEF' ? '9' : '0');
    return `${token}${seriesKey.replace('G', '')}${base}${tail}`;
}
/* Velocity through the pump drop's pipe size. Advisory only — the price list
   carries no flow data, and a pump drop is selected from the pump's connection
   size, not from flow. */
function pdVelocity(gpm, size) {
    if (!Number.isFinite(gpm) || gpm <= 0 || !size)
        return null;
    const nominal = parseFloat(size.split(' x ')[0]);
    const id = PIPE_ID[nominal];
    if (!id)
        return null;
    return round6((0.4085 * gpm) / (id * id));
}
/*

function evaluatePumpRow(row, config) {

    const lineMult = numOf(row.mult);
    const multiplier = lineMult === null ? config.multiplier : lineMult;
    const qty = numOf(row.qty) ?? 1;
